<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Marry CUCU? 💍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #1a0320;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  /* ---------- Romantic swirling background ---------- */
  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 20% 30%, #ff2d6b55 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, #ff69b455 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, #c2185b44 0%, transparent 55%),
      linear-gradient(135deg, #2b0418, #14020f, #2b0418);
    animation: swirl 24s linear infinite;
    z-index: -3;
  }
  @keyframes swirl {
    0%   { transform: rotate(0deg)   scale(1.1); }
    50%  { transform: rotate(180deg) scale(1.35); }
    100% { transform: rotate(360deg) scale(1.1); }
  }

  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 35%, rgba(20,0,15,.85) 100%);
    animation: breathe 6s ease-in-out infinite;
    z-index: -2;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: .75; }
    50%      { opacity: .45; }
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    z-index: 2;
  }

  .halo {
    position: absolute;
    width: 34rem; height: 34rem;
    max-width: 94vw; max-height: 94vw;
    border-radius: 50%;
    background: radial-gradient(circle, #ff2d6b55 0%, #ff69b422 40%, transparent 70%);
    animation: halo 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes halo {
    0%, 100% { transform: scale(1);    opacity: .8; }
    14%      { transform: scale(1.12); opacity: 1;  }
    28%      { transform: scale(1);    opacity: .8; }
    42%      { transform: scale(1.08); opacity: .95;}
    56%      { transform: scale(1);    opacity: .8; }
  }

  /* ---------- Spinning ring ---------- */
  .ring-emoji {
    font-size: clamp(3rem, 11vw, 5.5rem);
    animation: ringspin 4s ease-in-out infinite;
    filter: drop-shadow(0 0 18px #ffd700) drop-shadow(0 0 45px #ff2d6b);
    margin-bottom: .6rem;
  }
  @keyframes ringspin {
    0%, 100% { transform: rotateY(0deg)   translateY(0)     scale(1); }
    50%      { transform: rotateY(360deg) translateY(-14px) scale(1.12); }
  }

  /* ---------- The question ---------- */
  .question {
    position: relative;
    font-size: clamp(1.8rem, 7vw, 4.6rem);
    line-height: 1.15;
    background: linear-gradient(180deg, #fff0f6, #ff8ec0 45%, #ff2d6b 78%, #ff5fa2);
    background-size: 100% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px #ff2d6bcc) drop-shadow(0 0 40px #ff2d6b77);
    animation: shimmer 4s ease-in-out infinite, heartbeat 2.4s ease-in-out infinite;
    max-width: 22ch;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 50% 0%; }
    50%      { background-position: 50% 100%; }
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.05); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.03); }
    56%      { transform: scale(1); }
  }

  .sub {
    margin-top: 1rem;
    font-size: clamp(.85rem, 2.6vw, 1.15rem);
    font-style: italic;
    color: #ffd9e8cc;
    text-shadow: 0 0 14px #ff2d6b88;
    letter-spacing: .06em;
    min-height: 1.6em;
  }

  /* ---------- Buttons ---------- */
  .buttons {
    margin-top: 2.6rem;
    display: flex;
    gap: 1.4rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: clamp(1rem, 3vw, 1.5rem);
    padding: .75em 2.2em;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: .06em;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  #yes {
    background: linear-gradient(135deg, #ff2d6b, #ff6ea9);
    color: #fff;
    box-shadow: 0 0 22px #ff2d6baa, 0 8px 26px rgba(0,0,0,.45);
    animation: tempt 1.6s ease-in-out infinite;
  }
  #yes:hover { transform: scale(1.12); box-shadow: 0 0 40px #ff2d6b, 0 10px 34px rgba(0,0,0,.5); }
  @keyframes tempt {
    0%, 100% { box-shadow: 0 0 22px #ff2d6baa, 0 8px 26px rgba(0,0,0,.45); }
    50%      { box-shadow: 0 0 45px #ff2d6b,   0 8px 26px rgba(0,0,0,.45); }
  }

  #no {
    background: rgba(255,255,255,.10);
    color: #ffd9e8;
    border: 1px solid #ff6ea955;
    backdrop-filter: blur(4px);
  }
  #no.fleeing { position: fixed; z-index: 6; }

  /* ---------- Celebration screen ---------- */
  .celebrate {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    z-index: 7;
    background: radial-gradient(circle at center, #ff2d6b33, #14020fee 75%);
    backdrop-filter: blur(3px);
  }
  .celebrate.show { display: flex; animation: fadeIn .6s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .celebrate h2 {
    font-size: clamp(2rem, 9vw, 6rem);
    background: linear-gradient(180deg, #fff5fa, #ffb3d1 40%, #ff2d6b 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px #ff2d6b) drop-shadow(0 0 60px #ff2d6b99);
    animation: pop .8s cubic-bezier(.2,1.4,.4,1), heartbeat 2s ease-in-out infinite .8s;
  }
  @keyframes pop {
    0%   { transform: scale(.2) rotate(-12deg); opacity: 0; }
    100% { transform: scale(1)  rotate(0deg);   opacity: 1; }
  }
  .celebrate p {
    margin-top: 1.2rem;
    font-size: clamp(1rem, 3.4vw, 1.6rem);
    font-style: italic;
    color: #ffd9e8;
    text-shadow: 0 0 16px #ff2d6baa;
  }
  .rings {
    margin-top: 1.6rem;
    font-size: clamp(2rem, 8vw, 4rem);
    animation: ringspin 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px #ffd700);
  }
  .again {
    margin-top: 2.2rem;
    background: rgba(255,255,255,.12);
    color: #ffd9e8;
    border: 1px solid #ff6ea955;
    font-size: .95rem;
    padding: .6em 1.8em;
  }
  .again:hover { transform: scale(1.06); }

  /* ---------- Floating hearts ---------- */
  .heart {
    position: fixed;
    bottom: -60px;
    font-size: 1.5rem;
    pointer-events: none;
    z-index: 1;
    animation: rise linear forwards;
    filter: drop-shadow(0 0 10px #ff2d6b99);
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg) scale(.6); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translateY(-45vh) rotate(180deg) scale(1.15); }
    90%  { opacity: 1; }
    100% { transform: translateY(-105vh) rotate(360deg) scale(.7); opacity: 0; }
  }

  /* ---------- Sparkles ---------- */
  .sparkle {
    position: fixed;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px #ffb3d1;
    pointer-events: none;
    z-index: 1;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.3); }
    50%      { opacity: 1; transform: scale(1.4); }
  }

  /* ---------- Confetti / burst ---------- */
  .burst {
    position: fixed;
    font-size: 1.5rem;
    pointer-events: none;
    z-index: 9;
    animation: burst 1.1s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0,0) scale(.4) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--rot)); opacity: 0; }
  }

  .confetti {
    position: fixed;
    top: -5vh;
    font-size: 1.4rem;
    pointer-events: none;
    z-index: 8;
    animation: confetti linear forwards;
  }
  @keyframes confetti {
    0%   { transform: translateY(0) rotate(0deg);    opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: .9; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="vignette"></div>

<div class="stage" id="stage">
  <div class="halo"></div>

  <div class="ring-emoji">💍</div>

  <h1 class="question">Will you marry&nbsp;CUCU?</h1>
  <p class="sub" id="sub">Take your time… but the answer is yes 💕</p>

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No</button>
  </div>
</div>

<div class="celebrate" id="celebrate">
  <h2>SHE SAID YES!</h2>
  <p id="celebrateMsg">Happily ever after starts now 💞</p>
  <div class="rings">💍💐🥂</div>
  <button class="again" id="again">ask again 💗</button>
</div>

<script>
  const hearts = ['💖','💕','💗','💘','❤️','💓','💞','💝','🌹','💟','💍','✨'];

  /* ---- Floating hearts ---- */
  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (0.9 + Math.random() * 1.8) + 'rem';
    h.style.animationDuration = (7 + Math.random() * 6) + 's';
    h.style.opacity = 0.5 + Math.random() * 0.5;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 14000);
  }
  setInterval(spawnHeart, 450);
  for (let i = 0; i < 12; i++) setTimeout(spawnHeart, i * 280);

  /* ---- Sparkles ---- */
  for (let i = 0; i < 45; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top  = Math.random() * 100 + 'vh';
    s.style.animationDelay    = (Math.random() * 2.6) + 's';
    s.style.animationDuration = (1.8 + Math.random() * 2.5) + 's';
    document.body.appendChild(s);
  }

  /* ---- The "No" button runs away ---- */
  const noBtn  = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const sub    = document.getElementById('sub');

  const taunts = [
    'Nice try 😏',
    'The button disagrees 💅',
    'Not an option, sorry 💗',
    'It keeps running… like fate 🏃‍♀️💨',
    'Yes is right there 👉💖',
    'Even the button ships you two 🥰',
    'Resistance is futile 💘',
    'You almost had it! 😜'
  ];

  let dodges = 0;
  function flee() {
    dodges++;
    noBtn.classList.add('fleeing');

    const w = noBtn.offsetWidth  || 100;
    const h = noBtn.offsetHeight || 50;
    const x = Math.random() * (window.innerWidth  - w - 24) + 12;
    const y = Math.random() * (window.innerHeight - h - 24) + 12;

    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';

    // Yes grows more tempting with every dodge
    const scale = Math.min(1 + dodges * 0.12, 2.4);
    yesBtn.style.transform = 'scale(' + scale + ')';

    // ...and No shrinks away
    const shrink = Math.max(1 - dodges * 0.07, 0.45);
    noBtn.style.fontSize = (shrink) + 'rem';

    sub.textContent = taunts[(dodges - 1) % taunts.length];

    if (dodges >= 8) {
      noBtn.style.opacity = Math.max(1 - (dodges - 7) * 0.2, 0);
      if (dodges >= 12) {
        noBtn.style.display = 'none';
        sub.textContent = 'The "No" button gave up. Only one choice left 💍';
      }
    }
  }

  noBtn.addEventListener('mouseover', flee);
  noBtn.addEventListener('mouseenter', flee);
  noBtn.addEventListener('touchstart', e => { e.preventDefault(); flee(); }, { passive: false });
  noBtn.addEventListener('click', e => { e.preventDefault(); flee(); });

  /* ---- Bursts ---- */
  function burst(x, y, count) {
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'burst';
      b.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      const angle = (Math.PI * 2 * i) / count;
      const dist  = 90 + Math.random() * 160;
      b.style.left = x + 'px';
      b.style.top  = y + 'px';
      b.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      b.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      b.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1150);
    }
  }

  /* ---- Confetti rain ---- */
  function confettiRain(duration) {
    const pieces = ['💖','💗','🎉','✨','💍','🌹','💞','🎊','💐'];
    const timer = setInterval(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = pieces[Math.floor(Math.random() * pieces.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (0.9 + Math.random() * 1.6) + 'rem';
      c.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6500);
    }, 90);
    setTimeout(() => clearInterval(timer), duration);
  }

  /* ---- YES! ---- */
  const celebrate    = document.getElementById('celebrate');
  const celebrateMsg = document.getElementById('celebrateMsg');
  const finalMsgs = [
    'Happily ever after starts now 💞',
    'Forever officially begins today 💍',
    'Best decision ever made 💖',
    'Two hearts, one forever 💕'
  ];

  yesBtn.addEventListener('click', e => {
    const r = yesBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 24);
    confettiRain(9000);

    celebrateMsg.textContent = finalMsgs[Math.floor(Math.random() * finalMsgs.length)];
    celebrate.classList.add('show');

    // extra bursts around the screen
    for (let i = 0; i < 6; i++) {
      setTimeout(() => burst(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight,
        16
      ), i * 320);
    }
  });

  /* ---- Reset ---- */
  document.getElementById('again').addEventListener('click', () => {
    celebrate.classList.remove('show');
    dodges = 0;
    noBtn.classList.remove('fleeing');
    noBtn.removeAttribute('style');
    yesBtn.style.transform = '';
    sub.textContent = 'Take your time… but the answer is yes 💕';
  });

  /* ---- Click anywhere for a small burst ---- */
  document.addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') burst(e.clientX, e.clientY, 10);
  });
</script>

</body>
</html>
