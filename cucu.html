<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUCU 💖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #1a0320;
    font-family: 'Georgia', 'Times New Roman', serif;
    cursor: pointer;
  }

  /* ---------- Animated romantic background ---------- */
  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 20% 30%, #ff2d6b55 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, #ff69b455 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, #c2185b44 0%, transparent 55%),
      linear-gradient(135deg, #2b0418, #14020f, #2b0418);
    animation: swirl 22s linear infinite;
    z-index: -3;
  }
  @keyframes swirl {
    0%   { transform: rotate(0deg)   scale(1.1); }
    50%  { transform: rotate(180deg) scale(1.35); }
    100% { transform: rotate(360deg) scale(1.1); }
  }

  /* Soft breathing vignette */
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 35%, rgba(20,0,15,.85) 100%);
    animation: breathe 6s ease-in-out infinite;
    z-index: -2;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: .75; }
    50%      { opacity: .45; }
  }

  /* ---------- Center stage ---------- */
  .stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 2;
  }

  /* Pulsing halo behind the name */
  .halo {
    position: absolute;
    width: 30rem;
    height: 30rem;
    max-width: 90vw;
    max-height: 90vw;
    border-radius: 50%;
    background: radial-gradient(circle, #ff2d6b66 0%, #ff69b422 40%, transparent 70%);
    animation: halo 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes halo {
    0%, 100% { transform: scale(1);    opacity: .8; }
    14%      { transform: scale(1.14); opacity: 1;  }
    28%      { transform: scale(1);    opacity: .8; }
    42%      { transform: scale(1.10); opacity: .95;}
    56%      { transform: scale(1);    opacity: .8; }
  }

  /* Expanding love rings */
  .ring {
    position: absolute;
    width: 14rem;
    height: 14rem;
    border: 2px solid #ff6ea9;
    border-radius: 50%;
    animation: ripple 3.6s ease-out infinite;
    pointer-events: none;
  }
  .ring:nth-child(2) { animation-delay: 1.2s; }
  .ring:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ripple {
    0%   { transform: scale(.6); opacity: .7; }
    100% { transform: scale(3.4); opacity: 0; }
  }

  /* ---------- The name ---------- */
  .name {
    position: relative;
    display: flex;
    gap: .06em;
    font-size: clamp(4rem, 20vw, 13rem);
    font-weight: bold;
    letter-spacing: .05em;
    animation: heartbeat 2.4s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.09); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.06); }
    56%      { transform: scale(1); }
  }

  .name span {
    background: linear-gradient(180deg, #fff0f6, #ff8ec0 45%, #ff2d6b 75%, #ff5fa2);
    background-size: 100% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 0 rgba(0,0,0,0);
    filter:
      drop-shadow(0 0 12px #ff2d6bcc)
      drop-shadow(0 0 40px #ff2d6b88)
      drop-shadow(0 0 80px #ff69b455);
    animation:
      shimmer 4s ease-in-out infinite,
      float 3.6s ease-in-out infinite,
      glowpulse 2.4s ease-in-out infinite;
  }
  .name span:nth-child(1) { animation-delay: 0s,    0s,    0s; }
  .name span:nth-child(2) { animation-delay: .18s, .18s, .18s; }
  .name span:nth-child(3) { animation-delay: .36s, .36s, .36s; }
  .name span:nth-child(4) { animation-delay: .54s, .54s, .54s; }

  @keyframes shimmer {
    0%, 100% { background-position: 50% 0%; }
    50%      { background-position: 50% 100%; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-16px) rotate(-2deg); }
  }
  @keyframes glowpulse {
    0%, 100% { filter: drop-shadow(0 0 12px #ff2d6bcc) drop-shadow(0 0 40px #ff2d6b88) drop-shadow(0 0 80px #ff69b455); }
    50%      { filter: drop-shadow(0 0 22px #ff2d6b) drop-shadow(0 0 65px #ff2d6bcc) drop-shadow(0 0 120px #ff69b4aa); }
  }

  /* Little hearts orbiting the name */
  .orbit {
    position: absolute;
    width: 22rem;
    height: 22rem;
    max-width: 88vw;
    max-height: 88vw;
    animation: spin 14s linear infinite;
    pointer-events: none;
  }
  .orbit.reverse { animation: spin 20s linear infinite reverse; width: 30rem; height: 30rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .orbit i {
    position: absolute;
    font-style: normal;
    font-size: 1.6rem;
    filter: drop-shadow(0 0 8px #ff2d6b);
    animation: counterspin 14s linear infinite reverse;
  }
  .orbit.reverse i { animation: counterspin 20s linear infinite; }
  @keyframes counterspin { to { transform: rotate(360deg); } }

  .orbit i:nth-child(1) { top: -.8rem; left: 50%; }
  .orbit i:nth-child(2) { top: 50%; right: -.8rem; }
  .orbit i:nth-child(3) { bottom: -.8rem; left: 50%; }
  .orbit i:nth-child(4) { top: 50%; left: -.8rem; }

  /* ---------- Rotating love messages ---------- */
  .message {
    margin-top: 2.5rem;
    font-size: clamp(1rem, 3.2vw, 1.7rem);
    font-style: italic;
    color: #ffd9e8;
    text-shadow: 0 0 14px #ff2d6baa;
    letter-spacing: .08em;
    min-height: 2.2em;
    animation: fadeSlide 4s ease-in-out infinite;
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(14px); }
    18%  { opacity: 1; transform: translateY(0); }
    80%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-14px); }
  }

  .hint {
    position: fixed;
    bottom: 1.6rem;
    width: 100%;
    text-align: center;
    color: #ffb8d4aa;
    font-size: .8rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    animation: breathe 3s ease-in-out infinite;
  }

  /* ---------- Floating hearts ---------- */
  .heart {
    position: fixed;
    bottom: -60px;
    font-size: 1.5rem;
    pointer-events: none;
    z-index: 1;
    animation: rise linear forwards;
    filter: drop-shadow(0 0 10px #ff2d6b99);
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg) scale(.6);   opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translateY(-45vh) rotate(180deg) scale(1.15); }
    90%  { opacity: 1; }
    100% { transform: translateY(-105vh) rotate(360deg) scale(.7); opacity: 0; }
  }

  /* ---------- Sparkles ---------- */
  .sparkle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px #ffb3d1;
    pointer-events: none;
    z-index: 1;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.3); }
    50%      { opacity: 1; transform: scale(1.4); }
  }

  /* ---------- Click burst ---------- */
  .burst {
    position: fixed;
    font-size: 1.4rem;
    pointer-events: none;
    z-index: 5;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0,0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="vignette"></div>

<div class="stage">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="halo"></div>

  <div class="orbit"><i>💖</i><i>💕</i><i>💗</i><i>💘</i></div>
  <div class="orbit reverse"><i>❤️</i><i>💞</i><i>💓</i><i>💝</i></div>

  <h1 class="name" aria-label="CUCU">
    <span>C</span><span>U</span><span>C</span><span>U</span>
  </h1>

  <p class="message" id="message">Forever in my heart 💗</p>
</div>

<p class="hint">click anywhere for more love</p>

<script>
  /* ---- Rotating love messages ---- */
  const messages = [
    'Forever in my heart 💗',
    'You are my favourite feeling 💞',
    'Every heartbeat says your name 💓',
    'My whole world, wrapped in one word 💘',
    'Loved endlessly, always 💕',
    'You make ordinary days magical ✨',
    'Mine, today and always ❤️'
  ];
  let mi = 0;
  const msgEl = document.getElementById('message');
  setInterval(() => {
    mi = (mi + 1) % messages.length;
    msgEl.textContent = messages[mi];
  }, 4000);

  /* ---- Floating hearts ---- */
  const hearts = ['💖','💕','💗','💘','❤️','💓','💞','💝','🌹','💟'];
  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (0.9 + Math.random() * 1.8) + 'rem';
    h.style.animationDuration = (7 + Math.random() * 6) + 's';
    h.style.opacity = 0.5 + Math.random() * 0.5;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 14000);
  }
  setInterval(spawnHeart, 420);
  for (let i = 0; i < 14; i++) setTimeout(spawnHeart, i * 260);

  /* ---- Twinkling sparkles ---- */
  for (let i = 0; i < 45; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 2.6) + 's';
    s.style.animationDuration = (1.8 + Math.random() * 2.5) + 's';
    document.body.appendChild(s);
  }

  /* ---- Click / tap burst of hearts ---- */
  function burst(x, y) {
    for (let i = 0; i < 14; i++) {
      const b = document.createElement('div');
      b.className = 'burst';
      b.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      const angle = (Math.PI * 2 * i) / 14;
      const dist = 70 + Math.random() * 110;
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      b.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      b.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 950);
    }
  }
  document.addEventListener('click', e => burst(e.clientX, e.clientY));
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    burst(t.clientX, t.clientY);
  }, { passive: true });
</script>

</body>
</html>
